packages:
  - "packages/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@earendil-works/*"

catalogMode: strict

catalog:
  "@earendil-works/pi-agent-core": ^0.87.1
  "@earendil-works/pi-ai": ^0.87.1
  "@earendil-works/pi-coding-agent": ^0.87.1
  typebox: 1.3.27
  effect: 4.0.0-rc.117
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/sql-sqlite-node": 4.0.0-rc.117
  "@effect/tsgo": 0.45.0
  "@effect/vitest": 4.0.0-rc.117
  typescript: ^7.0.2
  "@types/node": ^26.6.2
  oxfmt: ^0.70.0
  oxlint: 1.85.0
  vitest: ^5.0.1
  "@modelcontextprotocol/client": ^2.0.0
  discord.js: ^14.27.0
  oxlint-tsgolint: 7.0.2001

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true

patchedDependencies:
  '@earendil-works/pi-coding-agent': patches/@earendil-works__pi-coding-agent.patch
