packages:
  - "packages/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@earendil-works/*"

catalogMode: strict

catalog:
  "@earendil-works/pi-agent-core": ^1.1.0
  "@earendil-works/pi-ai": ^1.1.0
  "@earendil-works/pi-coding-agent": ^1.1.0
  typebox: 1.3.36
  effect: 4.0.2
  "@effect/platform-node": 4.0.2
  "@effect/sql-sqlite-node": 4.0.2
  "@effect/tsgo": 0.51.1
  "@effect/vitest": 4.0.2
  typescript: ^7.0.2
  "@types/node": ^26.6.4
  oxfmt: ^0.72.0
  oxlint: 1.87.0
  vitest: ^5.0.3
  "@modelcontextprotocol/client": ^2.3.1
  discord.js: ^14.27.0
  oxlint-tsgolint: 7.0.2003

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true

patchedDependencies:
  '@earendil-works/pi-coding-agent': patches/@earendil-works__pi-coding-agent.patch
