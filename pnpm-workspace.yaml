packages:
  - "packages/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@earendil-works/*"

catalogMode: strict

catalog:
  "@earendil-works/pi-agent-core": ~1.5.0
  "@earendil-works/pi-ai": ~1.4.0
  "@earendil-works/pi-coding-agent": ~1.4.0
  "@earendil-works/pi-durable": ~1.4.0
  "@earendil-works/chord": ~1.4.0
  effect: 4.1.2
  typebox: 1.3.27
  "@effect/platform-node": 4.1.2
  "@effect/sql-sqlite-node": 4.1.2
  "@effect/tsgo": 0.67.5
  "@effect/vitest": 4.1.2
  typescript: ^7.0.2
  "@types/node": ^26.6.6
  oxfmt: ^0.77.0
  oxlint: 1.92.0
  vitest: ^5.1.0
  "@modelcontextprotocol/client": ^2.4.0
  discord.js: ^14.28.1
  oxlint-tsgolint: 7.0.2006

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true

patchedDependencies:
  '@earendil-works/pi-coding-agent': patches/@earendil-works__pi-coding-agent.patch
